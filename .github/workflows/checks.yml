name: Checks
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - LICENSE
  pull_request:
    paths-ignore:
      - '**/*.md'
      - LICENSE
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Stdlib Python and Node built-ins only; no installs, caches, or matrix.
      - name: Check backend and UI model
        run: |
          python3 -m unittest discover -s tests -q
          node tests/test_ui_model.cjs
